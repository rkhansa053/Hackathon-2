openapi: 3.0.3
info:
  title: Authentication API
  version: 1.0.0
  description: API for authentication and authorization functionality
servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.example.com
    description: Production server

paths:
  /api/v1/register:
    post:
      summary: Register a new user
      description: Creates a new user account with email and password
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: Invalid input or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/v1/login:
    post:
      summary: Authenticate user
      description: Authenticates user with email and password, returns JWT token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/v1/logout:
    post:
      summary: Logout user
      description: Invalidates the user's current session/token
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User logged out successfully
        '401':
          description: Unauthorized - invalid or expired token

  /api/v1/refresh:
    post:
      summary: Refresh access token
      description: Exchanges a refresh token for a new access token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          description: Invalid or expired refresh token
        '422':
          description: Validation error

  /api/v1/profile:
    get:
      summary: Get current user profile
      description: Returns the profile of the currently authenticated user
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Unauthorized - invalid or expired token

    put:
      summary: Update user profile
      description: Updates the profile of the currently authenticated user
      tags:
        - auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: Unauthorized - invalid or expired token
        '422':
          description: Validation error

  /api/v1/{user_id}/tasks:
    get:
      summary: Get user's tasks
      description: Retrieve all tasks belonging to the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
      responses:
        '200':
          description: Tasks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: User not found
        '422':
          description: Validation error

    post:
      summary: Create a new task
      description: Create a new task for the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: User not found
        '422':
          description: Validation error

  /api/v1/{user_id}/tasks/{id}:
    get:
      summary: Get a specific task
      description: Retrieve a specific task by ID for the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The task ID
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: Task not found
        '422':
          description: Validation error

    put:
      summary: Update a specific task
      description: Update a specific task by ID for the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The task ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: Task not found
        '422':
          description: Validation error

    delete:
      summary: Delete a specific task
      description: Delete a specific task by ID for the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The task ID
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: Task not found
        '422':
          description: Validation error

  /api/v1/{user_id}/tasks/{id}/complete:
    patch:
      summary: Toggle task completion
      description: Toggle the completion status of a specific task for the authenticated user
      tags:
        - tasks
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The authenticated user's ID (must match JWT token)
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The task ID
      responses:
        '200':
          description: Task completion toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRead'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - user_id does not match authenticated user
        '404':
          description: Task not found
        '422':
          description: Validation error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserBase:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address
      required:
        - email

    UserCreate:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
              minLength: 8
              description: User's password
          required:
            - password

    UserUpdate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address
        password:
          type: string
          minLength: 8
          description: User's new password
        is_active:
          type: boolean
          description: Whether the user account is active

    UserRead:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique user identifier
            created_at:
              type: string
              format: date-time
              description: Account creation timestamp
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
            is_active:
              type: boolean
              description: Whether the user account is active
          required:
            - id
            - created_at
            - updated_at
            - is_active

    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: User's password
      required:
        - email
        - password

    Token:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        token_type:
          type: string
          description: Token type (usually "bearer")
      required:
        - access_token
        - token_type

    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Refresh token to exchange for new access token
      required:
        - refresh_token

    TaskBase:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 1000
          description: Task description (optional)
        completed:
          type: boolean
          description: Whether the task is completed
      required:
        - title

    TaskCreate:
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            completed:
              type: boolean
              default: false
              description: Whether the task is completed (defaults to false)

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          description: Task title
        description:
          type: string
          maxLength: 1000
          description: Task description
        completed:
          type: boolean
          description: Whether the task is completed

    TaskRead:
      allOf:
        - $ref: '#/components/schemas/TaskBase'
        - type: object
          properties:
            id:
              type: string
              format: uuid
              description: Unique task identifier
            user_id:
              type: string
              format: uuid
              description: ID of the user who owns this task
            created_at:
              type: string
              format: date-time
              description: Task creation timestamp
            updated_at:
              type: string
              format: date-time
              description: Last update timestamp
          required:
            - id
            - user_id
            - created_at
            - updated_at

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error details
      required:
        - detail

    ValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
                description: Location of the validation error
              msg:
                type: string
                description: Error message
              type:
                type: string
                description: Error type
          description: Validation error details
      required:
        - detail